# dvc.yaml
# DVC pipeline definition for the Housing Price Prediction project.
# Run the full pipeline with:  dvc repro
# View metrics with:           dvc metrics show
# Compare experiments with:    dvc exp diff

stages:

  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
      - dataset/Housing.csv
    params:
      - data_ingestion.raw_data_path
      - data_ingestion.raw_dir
      - data_ingestion.test_size
      - data_ingestion.random_state
    outs:
      - data/raw/train.csv
      - data/raw/test.csv

  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - data/raw/train.csv
      - data/raw/test.csv
    params:
      - data_preprocessing.processed_dir
      - data_preprocessing.binary_cols
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  feature_engg:
    cmd: python src/feature_engg.py
    deps:
      - src/feature_engg.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - feature_engineering.features_dir
      - feature_engineering.onehot_cols
      - feature_engineering.create_area_per_bedroom
      - feature_engineering.create_total_rooms
      - feature_engineering.scale_features
    outs:
      - data/features/train.csv
      - data/features/test.csv
      - data/features/scaler.pkl

  model_building:
    cmd: python src/model_building.py
    deps:
      - src/model_building.py
      - data/features/train.csv
    params:
      - model_building.n_estimators
      - model_building.max_depth
      - model_building.min_samples_split
      - model_building.min_samples_leaf
      - model_building.random_state
      - model_building.target_column
    outs:
      - models/model.pkl

  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
      - src/model_evaluation.py
      - models/model.pkl
      - data/features/test.csv
    params:
      - model_evaluation.target_column
    metrics:
      - metrics/metrics.json:
          cache: false

params:
  - params.yaml
